<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Core Tests</title>
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    #summary {
      margin: 0 0 20px;
      font-size: 18px;
      font-weight: 700;
    }

    #results {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #results li {
      margin-bottom: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px;
    }

    .pass {
      background: #dcfce7;
      color: #166534;
    }

    .fail {
      background: #fee2e2;
      color: #991b1b;
    }

    .error {
      display: block;
      margin-top: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>shared/core.js tests</h1>
  <p id="summary">Running…</p>
  <ul id="results"></ul>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/premium.js"></script>
  <script src="../shared/ads.js"></script>
  <script src="test-core.js"></script>
</body>
</html>
