<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Tracker</title>
  <link rel="icon" href="../icons/icon16.png">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img class="logo" src="../icons/icon48.png" alt="" width="36" height="36">
      <div class="brand">
        <h1>Job Application Tracker</h1>
        <p id="totalCount" class="total-count">0 jobs</p>
      </div>
      <div class="topbar-actions">
        <button type="button" id="exportBtn" class="btn">Export CSV</button>
        <button type="button" id="addBtn" class="btn btn-primary">+ Add job</button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="toolbar" aria-label="Filter and sort">
      <div id="filters" class="filters" role="group" aria-label="Filter by status"></div>
      <div class="toolbar-controls">
        <input id="search" type="search" dir="auto" placeholder="Search title, company, location, notes" aria-label="Search jobs" autocomplete="off">
        <select id="sort" aria-label="Sort jobs">
          <option value="saved-desc">Newest saved</option>
          <option value="saved-asc">Oldest saved</option>
          <option value="applied-desc">Recently applied</option>
          <option value="updated-desc">Recently updated</option>
          <option value="company-asc">Company A–Z</option>
          <option value="title-asc">Title A–Z</option>
          <option value="status">Status</option>
        </select>
      </div>
    </section>

    <div id="followUpBanner" class="banner" role="status" hidden></div>

    <div id="tableWrap" class="table-wrap">
      <table class="jobs-table">
        <thead>
          <tr>
            <th scope="col" class="col-title">Title</th>
            <th scope="col">Company</th>
            <th scope="col">Location</th>
            <th scope="col">Status</th>
            <th scope="col">Saved</th>
            <th scope="col">Applied</th>
            <th scope="col" class="col-actions"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="jobsBody"></tbody>
      </table>
    </div>

    <div id="emptyState" class="empty-state" hidden>
      <h2 id="emptyTitle"></h2>
      <p id="emptyText"></p>
    </div>
  </main>

  <dialog id="jobDialog" class="job-dialog" aria-labelledby="dialogTitle">
    <form id="dialogForm" novalidate>
      <h2 id="dialogTitle" class="dialog-title">Add a job</h2>

      <div class="dialog-grid">
        <div class="field span-2">
          <label for="f-title">Job title <span class="required" aria-hidden="true">*</span></label>
          <input id="f-title" type="text" dir="auto" maxlength="300" required autocomplete="off">
        </div>

        <div class="field">
          <label for="f-company">Company</label>
          <input id="f-company" type="text" dir="auto" maxlength="200" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-location">Location</label>
          <input id="f-location" type="text" dir="auto" maxlength="200" autocomplete="off">
        </div>

        <div class="field span-2">
          <label for="f-url">Link</label>
          <input id="f-url" type="url" dir="ltr" maxlength="2000" placeholder="https://" autocomplete="off">
        </div>

        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status"></select>
        </div>
        <div class="field">
          <label for="f-dateApplied">Date applied</label>
          <input id="f-dateApplied" type="date">
        </div>

        <div class="field span-2">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes" dir="auto" maxlength="5000" rows="4" placeholder="Recruiter, salary, next step..."></textarea>
        </div>
      </div>

      <p id="dialogError" class="form-error" role="alert" hidden></p>

      <div class="dialog-actions">
        <button type="button" id="cancelBtn" class="btn">Cancel</button>
        <button type="submit" id="dialogSaveBtn" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="../shared/core.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
