<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title data-i18n="popupBrand">Job Tracker</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="logo" src="../icons/icon48.png" alt="" width="32" height="32">
    <h1 class="brand" data-i18n="popupBrand">Job Tracker</h1>
    <button type="button" id="openDashboard" class="btn btn-ghost btn-sm" data-i18n="openDashboard">Dashboard ↗</button>
  </header>

  <main class="content">
    <div id="notice" class="notice" role="status" hidden></div>

    <form id="jobForm" novalidate>
      <div class="field">
        <label for="title"><span data-i18n="fieldTitle">Job title</span> <span class="required" aria-hidden="true">*</span></label>
        <input id="title" name="title" type="text" dir="auto" maxlength="300" required autocomplete="off">
      </div>

      <div class="row">
        <div class="field">
          <label for="company" data-i18n="fieldCompany">Company</label>
          <input id="company" name="company" type="text" dir="auto" maxlength="200" autocomplete="off">
        </div>
        <div class="field">
          <label for="location" data-i18n="fieldLocation">Location</label>
          <input id="location" name="location" type="text" dir="auto" maxlength="200" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label for="url" data-i18n="fieldLink">Link</label>
        <input id="url" name="url" type="url" dir="ltr" maxlength="2000" placeholder="https://" autocomplete="off">
      </div>

      <fieldset class="field">
        <legend data-i18n="fieldStatus">Status</legend>
        <div id="statusPicker" class="status-picker"></div>
      </fieldset>

      <div class="field">
        <label for="notes" data-i18n="fieldNotes">Notes</label>
        <textarea id="notes" name="notes" dir="auto" maxlength="5000" rows="3" placeholder="Recruiter, salary, next step..." data-i18n-placeholder="notesPlaceholder"></textarea>
      </div>

      <p id="formError" class="form-error" role="alert" hidden></p>

      <button type="submit" id="saveBtn" class="btn btn-primary btn-block" data-i18n="saveJob">Save job</button>
    </form>
  </main>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/extractor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
